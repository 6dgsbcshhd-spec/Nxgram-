<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nexogram">
<title>Nexogram</title>
<style>
:root{--bg:#F2F2F6;--cd:#fff;--tx:#000;--mu:#8E8E93;--ac:#3B82F6;--in:#F2F2F6}
html[data-th=dark]{--bg:#000;--cd:#1C1C1E;--tx:#fff;--mu:#9a9aa0;--in:#2C2C2E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font:16px -apple-system,Roboto,sans-serif;background:var(--bg);color:var(--tx);transition:background .3s}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.pg{flex:1;overflow:auto;padding:14px 14px 110px}.an>*{animation:in .38s cubic-bezier(.2,.8,.2,1) both}.an>*:nth-child(2){animation-delay:.04s}.an>*:nth-child(3){animation-delay:.08s}.an>*:nth-child(n+4){animation-delay:.12s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}@keyframes pop{from{opacity:0;transform:scale(.85)}}
h1{margin:6px 4px 12px;font-size:30px}h2{margin:4px 0}small{color:var(--mu)}
input,textarea{width:100%;padding:13px;margin:0 0 10px;border:0;border-radius:14px;background:var(--cd);color:var(--tx);font:inherit;outline:0}
button{font:inherit;cursor:pointer;transition:transform .15s,opacity .2s}button:active{transform:scale(.95);opacity:.8}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-weight:700;margin-bottom:8px}.btn.red{background:#FF3B30}.btn.org{background:#FF9500}.btn.grn{background:#34C759}.btn.gr{background:var(--cd);color:var(--tx)}
.lnk{background:none;border:0;color:var(--ac);display:block;margin:12px auto}
.row{display:flex;align-items:center;gap:12px;background:var(--cd);padding:11px;border-radius:14px;margin-bottom:4px;transition:transform .15s}.row:active{transform:scale(.98)}
.t{flex:1;min-width:0}.t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#8B5CF6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;overflow:hidden;position:relative}.av img{width:100%;height:100%;object-fit:cover}
.dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:#34C759;border:2px solid var(--cd)}
.i{display:inline-block;vertical-align:middle;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.bdg{display:block;font-size:11px;color:var(--ac);font-weight:700;letter-spacing:.3px}
.card{background:var(--cd);padding:14px;border-radius:14px;margin-bottom:10px}
nav{position:fixed;left:18px;right:18px;bottom:calc(16px + env(safe-area-inset-bottom));height:66px;display:flex;background:color-mix(in srgb,var(--cd) 85%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:32px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}nav .on{color:var(--ac);font-weight:700}nav .on .i{transform:scale(1.15)}nav .i{transition:transform .25s}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--cd)}.top button{background:none;border:0;color:var(--ac);padding:6px}
#ms{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:9px 12px;border-radius:18px;background:var(--cd);align-self:flex-start;word-wrap:break-word;animation:pop .22s}.b.me{background:var(--ac);color:#fff;align-self:flex-end}
.b img{max-width:100%;border-radius:12px;display:block}.b small{display:block;text-align:right;font-size:11px;color:inherit;opacity:.7}
.ib{display:flex;gap:8px;align-items:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--cd)}.ib input{margin:0;background:var(--in);border-radius:20px}.ib button{border:0;background:none;color:var(--mu);padding:4px}
.snd{width:42px;height:42px;border-radius:50%;background:var(--ac)!important;color:#fff!important;display:flex;align-items:center;justify-content:center}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g{border:0;background:var(--cd);border-radius:18px;padding:8px;text-align:center;font-size:12px;color:var(--tx)}.g svg{display:block;margin:0 auto 4px;width:100%;height:auto}
.sw{width:46px;height:28px;border-radius:14px;background:#aaa;position:relative;transition:.25s;flex:none}.sw:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s}.sw.on{background:#34C759}.sw.on:after{left:21px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9;animation:in .4s;padding:20px}.env{animation:pu 1.2s infinite}@keyframes pu{50%{transform:scale(1.12)}}
.ctr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.seg{display:flex;background:var(--cd);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;color:var(--tx);padding:9px;border-radius:10px}.seg .on{background:var(--ac);color:#fff}
.pbadge{color:#A855F7}

/* ---------- Firebase ---------- */
const upd=(id,o)=>updateDoc(doc(db,'users',id),o);
function start(){unsubs=[
  onSnapshot(doc(db,'users',user.uid),s=>{me=s.exists()?{id:s.id,...s.data()}:null;ui()},()=>{}),
  onSnapshot(doc(db,'config','app'),s=>{cfg=s.exists()?s.data():{};ui()},()=>{}),
  onSnapshot(collection(db,'users'),s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));ui();updHead()},()=>{}),
  onSnapshot(query(collection(db,'chats'),where('participants','array-contains',user.uid)),s=>{chats=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>tm(b.updatedAt)-tm(a.updatedAt));ui();updHead()},()=>{})];beat()}
function stop(){unsubs.forEach(u=>u());unsubs=[];unM&&unM();unM=null;me=null;peer=null;sub=null}
onAuthStateChanged(auth,u=>{user=u;if(u)start();else stop();anim=true;render()});
const beat=()=>{if(user&&!document.hidden)upd(user.uid,{lastSeen:serverTimestamp()}).catch(()=>{})};
setInterval(beat,25000);document.addEventListener('visibilitychange',beat);
const updHead=()=>{const e=$('#st');if(e&&peer)e.textContent=stat()};setInterval(updHead,2000);
const shrink=(f,max,qq)=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',qq))};im.src=fr.result};fr.readAsDataURL(f)});
async function sendMsg(o,last){const id=cid(peer.id);
  if(U(peer.id)?.blocked?.includes(user.uid))return alert('Пользователь вас заблокировал');
  if(me.blocked?.includes(peer.id))return alert('Вы заблокировали этого пользователя');
  try{if(chats.some(c=>c.id===id))await updateDoc(doc(db,'chats',id),{lastMessage:last,updatedAt:serverTimestamp()});else await setDoc(doc(db,'chats',id),{participants:[user.uid,peer.id].sort(),lastMessage:last,updatedAt:serverTimestamp()});
    await addDoc(collection(db,'chats',id,'messages'),{text:'',...o,from:user.uid,read:false,createdAt:serverTimestamp()})}catch(x){alert('Ошибка: '+x.message)}}
async function tgt(){return U(subId)}

const acts={
  kind(d){kind=d.k;render()},mode(){mode=mode==='login'?'register':'login';render()},
  async auth(){if(busy)return;busy=true;try{await acts._auth()}finally{busy=false}},
  async _auth(){let e=$('#em').value.trim().toLowerCase();const p=$('#pw').value;
    if(kind==='phone'){const dg=e.replace(/\D/g,'');if(dg.length<10)return alert('Введи номер телефона');e='p'+dg+'@nexo.phone'}
    try{if(mode==='login')await signInWithEmailAndPassword(auth,e,p);else{const n=$('#nn').value.trim();let un=$('#un').value.trim().toLowerCase();
      if(!n)return alert('Введи имя');if(!/^[a-z0-9_]{4,20}$/.test(un))return alert('Юзернейм: 4–20 символов, a-z, 0-9, _');
      const c=await createUserWithEmailAndPassword(auth,e,p);
      if(!(await getDocs(query(collection(db,'users'),where('username','==',un)))).empty)un=un.slice(0,15)+Math.floor(1000+Math.random()*9000);
      const o=e===OWNER;await setDoc(doc(db,'users',c.user.uid),{nickname:n,username:un,email:e,phone:o?OPHONE:(kind==='phone'?'+'+e.slice(1).split('@')[0]:null),isAdmin:o,frozen:false,premium:false,badge:null,tg:null,balance:0,gifts:[],bio:'',avatar:null,birthday:null,birthdayClaimedYear:null,priv:{},blocked:[],lastSeen:serverTimestamp(),createdAt:serverTimestamp()})}}catch(x){alert(ERR[x.code]||x.message)}},
  async reset(){const e=$('#em').value.trim();if(!e)return alert('Введи email');try{await sendPasswordResetEmail(auth,e);alert('Письмо отправлено')}catch(x){alert(ERR[x.code]||x.message)}},
  tab(d){tab=d.t;sub=null;q='';anim=true;render()},sub(d){sub=d.s||null;subId=d.id||null;q='';peer=null;unM&&unM();anim=true;render()},
  open(d){peer={id:d.id};msgs=[];sub=null;render();unM&&unM();
    unM=onSnapshot(query(collection(db,'chats',cid(d.id),'messages'),orderBy('createdAt','desc'),limit(100)),s=>{msgs=s.docs.map(x=>({id:x.id,...x.data()})).reverse();updMsgs();
      if(me.priv?.rd!==false)s.docs.forEach(x=>{const m=x.data();if(m.from!==user.uid&&!m.read)updateDoc(x.ref,{read:true}).catch(()=>{})})},()=>{})},
  back(){unM&&unM();unM=null;peer=null;anim=true;render()},
  async send(){const i=$('#mi'),t=i.value.trim();if(!t)return;i.value='';await sendMsg({text:t},t)},
  pickF(){$('#fi').click()},pickA(){$('#fa').click()},
  async prof(){const n=$('#nk').value.trim(),un=$('#un').value.trim().toLowerCase(),b=$('#bd').value.trim();if(!n)return alert('Введи имя');
    if(!/^[a-z0-9_]{4,20}$/.test(un))return alert('Юзернейм: 4–20 символов, a-z, 0-9, _');
    if(b&&!/^(0[1-9]|[12]\d|3[01])\.(0[1-9]|1[0-2])$/.test(b))return alert('День рождения: ДД.ММ');
    if(un!==me.username&&!(await getDocs(query(collection(db,'users'),where('username','==',un)))).empty)return alert('Юзернейм занят');
    try{await upd(user.uid,{nickname:n,username:un,bio:$('#bio').value.trim(),birthday:b||null});alert('Сохранено');sub=null;render()}catch(x){alert(x.message)}},
  async pv(d){await upd(user.uid,{priv:{...me.priv,[d.k]:me.priv?.[d.k]===false}}).catch(x=>alert(x.message))},
  async blk(d){await upd(user.uid,{blocked:me.blocked?.includes(d.id)?arrayRemove(d.id):arrayUnion(d.id)}).catch(x=>alert(x.message))},
  async pass(){try{await sendPasswordResetEmail(auth,me.email);alert('Письмо отправлено на '+me.email)}catch(x){alert(x.message)}},
  dark(){const d=document.documentElement.dataset.th==='dark';document.documentElement.dataset.th=d?'light':'dark';LS('th',d?'light':'dark');render()},
  acc(d){document.documentElement.style.setProperty('--ac',d.c);LS('ac',d.c)},
  tg(d){window.open(d.u,'_blank')},cp(d){navigator.clipboard?.writeText(d.t);alert('ID скопирован')},
  async buy(d){const g=GIFTS.find(x=>x[0]===d.g);if(me.gifts?.includes(g[0]))return alert('Уже есть');if((me.balance||0)<g[5])return alert('Не хватает звёзд');
    if(confirm(`Купить «${g[1]}» за ${g[5]} звёзд?`))await upd(user.uid,{balance:increment(-g[5]),gifts:arrayUnion(g[0])}).catch(x=>alert(x.message))},
  async app(){await setDoc(doc(db,'config','app'),{closed:!cfg.closed},{merge:true}).catch(x=>alert(x.message))},
  async adm(d){const u=U(subId);if(!u)return;
    if(d.k==='frz'&&(u.id===user.uid||u.email===OWNER||(u.isAdmin&&!owner())))return alert('Этот аккаунт нельзя заморозить');
    if(d.k==='adm'&&(u.email===OWNER||u.id===user.uid))return alert('Нельзя изменить права этого аккаунта');

    if(d.k==='frz')await upd(u.id,{frozen:!u.frozen});
    if(d.k==='prem')await upd(u.id,{premium:!u.premium});

    alert('Готово')}catch(x){alert('Ошибка: '+x.message)}},
  lt1(){lt=1;render()},async lt2(){lt=0;await upd(user.uid,{letter:null}).catch(()=>{})},
